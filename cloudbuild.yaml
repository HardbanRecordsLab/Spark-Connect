# Google Cloud Run deployment for Spark Connect
# Use this ONLY if you prefer GCP over Vercel/Netlify.
# For most use cases Vercel is simpler and cheaper.
#
# Prerequisites:
#   gcloud auth login
#   gcloud config set project YOUR_PROJECT_ID
#   gcloud services enable run.googleapis.com cloudbuild.googleapis.com

steps:
  # 1. Install dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['install']

  # 2. Build Vite app
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    env:
      - 'VITE_SUPABASE_URL=$_VITE_SUPABASE_URL'
      - 'VITE_SUPABASE_PUBLISHABLE_KEY=$_VITE_SUPABASE_PUBLISHABLE_KEY'
      - 'VITE_VAPID_PUBLIC_KEY=$_VITE_VAPID_PUBLIC_KEY'

  # 3. Build and push Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'gcr.io/$PROJECT_ID/spark-connect:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/spark-connect:$COMMIT_SHA']

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - spark-connect
      - '--image=gcr.io/$PROJECT_ID/spark-connect:$COMMIT_SHA'
      - '--region=europe-central2'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'

substitutions:
  _VITE_SUPABASE_URL: ''
  _VITE_SUPABASE_PUBLISHABLE_KEY: ''
  _VITE_VAPID_PUBLIC_KEY: ''

images:
  - 'gcr.io/$PROJECT_ID/spark-connect:$COMMIT_SHA'
